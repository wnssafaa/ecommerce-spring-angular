<div class="container">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>
        {{ isEditMode ? 'Modifier le produit' : 'Ajouter un nouveau produit' }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="produitForm" (ngSubmit)="onSubmit()" class="produit-form">
        <mat-form-field appearance="outline">
          <mat-label>Nom</mat-label>
          <input matInput formControlName="nom" required>
          <mat-error *ngIf="produitForm.get('nom')?.hasError('required')">
            Le nom est obligatoire
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3"></textarea>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Prix (MAD)</mat-label>
            <input matInput type="number" formControlName="prix" min="0" step="0.01" required>
            <mat-error *ngIf="produitForm.get('prix')?.hasError('required')">
              Le prix est obligatoire
            </mat-error>
            <mat-error *ngIf="produitForm.get('prix')?.hasError('min')">
              Le prix doit être positif
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Quantité</mat-label>
            <input matInput type="number" formControlName="quantite" min="0" required>
            <mat-error *ngIf="produitForm.get('quantite')?.hasError('required')">
              La quantité est obligatoire
            </mat-error>
            <mat-error *ngIf="produitForm.get('quantite')?.hasError('min')">
              La quantité doit être positive
            </mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
          <mat-label>Catégorie</mat-label>
          <mat-select formControlName="categorieId" required>
            <mat-option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.nom }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="produitForm.get('categorieId')?.hasError('required')">
            La catégorie est obligatoire
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
            <span *ngIf="!isLoading">{{ isEditMode ? 'Modifier' : 'Ajouter' }}</span>
            <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
          </button>

          <button mat-button type="button" (click)="router.navigate(['/produits'])">
            Annuler
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
