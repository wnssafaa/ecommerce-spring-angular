<div class="container">
    <!-- Formulaire d'ajout/modification -->
    <mat-card class="form-card">
      <mat-card-header>
        <mat-card-title>
          {{ isEditing ? 'Modifier la catégorie' : 'Ajouter une nouvelle catégorie' }}
        </mat-card-title>
      </mat-card-header>
      
      <mat-card-content>
        <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline">
            <mat-label>Nom de la catégorie</mat-label>
            <input matInput formControlName="nom" required>
            
            <mat-error *ngIf="categoryForm.get('nom')?.hasError('required')">
              Le nom est obligatoire
            </mat-error>
            <mat-error *ngIf="categoryForm.get('nom')?.hasError('minlength')">
              Minimum 3 caractères
            </mat-error>
          </mat-form-field>
  
          <div class="form-actions">
            <button 
              mat-raised-button 
              color="primary" 
              type="submit"
              [disabled]="!categoryForm.valid || isSubmitting">
              <mat-icon>{{ isEditing ? 'save' : 'add' }}</mat-icon>
              {{ isSubmitting ? 'En cours...' : (isEditing ? 'Sauvegarder' : 'Ajouter') }}
            </button>
  
            <button 
              *ngIf="isEditing"
              mat-raised-button 
              color="basic" 
              type="button"
              (click)="cancelEdit()">
              <mat-icon>cancel</mat-icon>
              Annuler
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
