<div class="container">
  <button mat-stroked-button (click)="router.navigate(['/categories'])" >
    <mat-icon>arrow_back</mat-icon>
    Retour à la liste
  </button>

  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>
        {{ isEditing ? 'Modification de catégorie' : 'Nouvelle catégorie' }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Nom de la catégorie</mat-label>
          <input matInput formControlName="nom" required>
          
          <mat-error *ngIf="categoryForm.get('nom')?.hasError('required')">
            Le nom est obligatoire
          </mat-error>
          <mat-error *ngIf="categoryForm.get('nom')?.hasError('minlength')">
            Minimum 3 caractères
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button 
            mat-raised-button 
            color="primary" 
            type="submit"
            [disabled]="!categoryForm.valid || isSubmitting">
            
            <mat-icon *ngIf="!isSubmitting">
              {{ isEditing ? 'save' : 'add' }}
            </mat-icon>
            <mat-spinner *ngIf="isSubmitting" diameter="20"></mat-spinner>
            {{ isSubmitting ? 'En cours...' : (isEditing ? 'Sauvegarder' : 'Ajouter') }}
          </button>

          <button 
            *ngIf="isEditing"
            mat-raised-button 
            color="warn" 
            type="button"
            (click)="cancelEdit()">
            <mat-icon>cancel</mat-icon>
            Annuler
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
