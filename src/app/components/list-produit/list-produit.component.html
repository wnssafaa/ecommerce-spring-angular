<!-- list-produit.component.html -->
<div class="container">
    <div class="header">
      <h1>Liste des Produits</h1>
      
      <div class="controls">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Rechercher</mat-label>
          <input matInput [(ngModel)]="searchText" (input)="applyFilter()" placeholder="Nom ou description">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="category-filter">
          <mat-label>Filtrer par catégorie</mat-label>
          <mat-select [(ngModel)]="selectedCategory" (selectionChange)="applyFilter()">
            <mat-option [value]="null">Toutes les catégories</mat-option>
            <mat-option *ngFor="let cat of categories" [value]="cat.id">{{ cat.nom }}</mat-option>
          </mat-select>
        </mat-form-field>
  
        <button mat-raised-button color="primary" (click)="router.navigate(['/product'])">
          <mat-icon>add</mat-icon> Nouveau Produit
        </button>
      </div>
    </div>
  
    <div *ngIf="isLoading" class="loading">
      <mat-spinner diameter="50"></mat-spinner>
      <p>Chargement des produits...</p>
    </div>
  
    <div class="table-container" *ngIf="!isLoading">
      <table mat-table [dataSource]="dataSource" matSort>
        <!-- Colonnes -->
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column | titlecase }}</th>
          <td mat-cell *matCellDef="let element">
            <span *ngIf="column !== 'actions'">
              {{ column === 'prix' ? (element[column] | currency:'MAD':'symbol':'1.2-2') : element[column] }}
            </span>
            <div *ngIf="column === 'actions'" class="actions">
              <button mat-icon-button color="primary" (click)="editProduit(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteProduit(element.id!)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
  
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
